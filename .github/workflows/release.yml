name: Release

# A tag v<version> builds the Linux packages and the Windows installers, with the command-line tool and the signed updates
# of the app, and attaches them to a draft release. The macOS app is added to the draft from the
# Mac that holds its Developer ID (Releasing, in the README): the runner has neither the
# identity nor the notary credentials. You publish the draft: installed apps then update to it.
# Run by hand, it builds everything as artifacts of the run, the macOS app signed ad hoc,
# without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # disk images need macOS; the runner signs the app ad hoc, which Apple does not notarize
          - { name: macOS, os: macos-latest, platform: darwin/universal, flags: "-sign - -skip-notarize", cli: "darwin/arm64 darwin/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64", flags: "", cli: "linux/amd64 linux/arm64" }
          # on Windows mygo downloads NSIS for the installer; nothing signs it with Authenticode yet
          - { name: Windows, os: windows-latest, platform: "windows/amd64,windows/arm64", flags: "", cli: "windows/amd64 windows/arm64" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version app/mygo.json)"
      # Installed apps update themselves from the release (updates in app/mygo.json): with the
      # key, the build signs an update archive for each platform and writes its manifest,
      # update-<platform>.json, and the deltas from the versions before. A release without
      # them is one that no installed app can update to.
      - name: Check the update key
        if: github.ref_type == 'tag'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Set the MYGO_UPDATER_PRIVATE_KEY secret: the key that signs updates (mygo keygen)"
            exit 1
          fi
      # Not the macOS app of a release: an ad hoc signed one would replace the notarized one.
      - name: Build the app
        if: matrix.name != 'macOS' || github.ref_type != 'tag'
        working-directory: app
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run github.com/egoist/mygo/cmd/mygo build -platform "${{ matrix.platform }}" ${{ matrix.flags }} .
      - name: Build the command-line tool
        run: |
          version=$(jq -r .version app/mygo.json)
          mkdir -p dist
          for t in ${{ matrix.cli }}; do
            os=${t%/*} arch=${t#*/}
            dir=$(mktemp -d)
            if [ "$os" = windows ]; then
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$dir/tossy.exe" ./cmd/tossy
              7z a -tzip "dist/tossy-cli-$version-$os-$arch.zip" "$dir/tossy.exe" > /dev/null
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$dir/tossy" ./cmd/tossy
              tar -czf "dist/tossy-cli-$version-$os-$arch.tar.gz" -C "$dir" tossy
            fi
          done
      - name: Collect the files
        run: |
          shopt -s nullglob
          files=(app/build/*/*.dmg app/build/*/*.deb app/build/*/*.rpm app/build/*/*.tar.gz app/build/*/*-setup-*.exe)
          files+=(app/build/*/update-*.json app/build/*/*.delta) # what installed apps update from
          if [ ${#files[@]} -gt 0 ]; then cp "${files[@]}" dist/; fi # none from macOS on a tag
          # one install.sh serves every architecture
          if [ -f app/build/linux-amd64/install.sh ]; then cp app/build/linux-amd64/install.sh dist/; fi
          if [ -f app/build/windows-amd64/install.ps1 ]; then cp app/build/windows-amd64/install.ps1 dist/; fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release and its files
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Tossy ${GITHUB_REF_NAME#v}" --generate-notes
          fi
