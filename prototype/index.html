<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tossy — 磁盘空间分析与清理</title>
<style>
:root{
  --bg:#131315;--bg2:#1a1a1d;--bg3:#222226;--hov:#ffffff09;--sel:#ffffff10;--line:#ffffff0f;
  --text:#ececef;--t2:#a3a3ab;--t3:#74747d;--t4:#4e4e56;
  --safe:#6fc39a;--review:#d4a656;--risky:#de7f86;--prot:#7f838e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Inter,Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:minmax(0,1fr) 30px;height:100%}
.num{font-variant-numeric:tabular-nums}

.logo{display:flex;align-items:center;flex:none;color:var(--text);margin-right:4px}
.logo svg{width:18px;height:18px}
/* disk summary (top of right panel) */
.disk{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.disk .dt{display:flex;align-items:center;gap:8px;margin:-4px -8px 6px 0}
.disk #dVol{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diskbar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;display:flex}
.diskbar>div{height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.diskbar .u{background:var(--t2)}
.diskbar .t{background:var(--review)}
.disktxt{font-size:12px;color:var(--t3);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disktxt b{color:var(--t2);font-weight:500}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;border:0;background:none;padding:0 11px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--t2);transition:background .12s,color .12s}
.btn:hover{background:var(--hov);color:var(--text)}
.btn.icon{width:30px;padding:0}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.solid{background:var(--bg3);color:var(--text)}
.btn.solid:hover{background:#2b2b30}
.btn.primary{background:var(--text);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#fff;color:var(--bg)}
.btn.danger{background:var(--risky);color:#1b0f10;font-weight:600}
.btn.danger:hover{background:#e8949a;color:#1b0f10}
.btn:disabled{opacity:.35;cursor:not-allowed;background:none}
.btn.primary:disabled{background:var(--bg3);color:var(--t3);opacity:1}
.btn svg{width:15px;height:15px;flex:none}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;color:var(--t3);padding:3px 8px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.tabs button:hover{color:var(--t2)}
.tabs button.on{color:var(--text);background:var(--hov)}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,33%,400px);min-height:0;min-width:0}
#left{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.ltop{display:flex;align-items:center;gap:10px;padding:14px 16px 0 18px;min-width:0}
.crumbs{overflow:hidden}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;min-width:0;flex:1;font-size:13px}
.crumbs span{padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--t3);white-space:nowrap}
.crumbs span:hover{color:var(--text)}
.crumbs span.cur{color:var(--text);cursor:default}
.crumbs i{color:var(--t4);font-style:normal;padding:0 1px}
#chartwrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:20px;top:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t3);pointer-events:none}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:6px;height:6px;border-radius:50%;flex:none}
.legend b{color:var(--t2);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.lbot{display:flex;align-items:center;gap:10px;padding:0 16px 16px 20px;min-width:0}
.lbot .cs{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t3)}
.lbot .cs b{color:var(--text);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;margin-right:4px}
.lbot .cs i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--safe);margin-right:8px;transform:translateY(-1px)}
#scan{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:5;background:var(--bg)}
#scan.on{display:flex}
#scan .num{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
#scan .path{font:11px var(--mono);color:var(--t4);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- right ---------- */
#right{display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:flex-end;gap:10px;padding:14px 18px 8px;min-width:0}
.lhead .t{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhead .c{color:var(--t3);font-size:12px;white-space:nowrap;margin-top:1px}
#list{flex:0 1 auto;overflow:auto;position:relative;min-height:120px}
#spacer{position:relative}
.row{position:absolute;left:8px;right:8px;height:32px;display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;border-radius:6px;cursor:default}
.row:hover,.row.hov{background:var(--hov)}
.row.sel{background:var(--sel)}
.sw{width:8px;height:8px;border-radius:2px;flex:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm.dir{color:var(--text)}
.row .nm.file{color:var(--t2)}
.row .fl{font-size:11.5px;flex:none}
.row .fl.safe{color:var(--safe)}
.row .fl svg{width:12px;height:12px;color:var(--t4);display:block}
.row .sz{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--t2);flex:none}
.del{width:26px;height:26px;border-radius:6px;border:0;background:none;color:var(--t4);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:color .12s,background .12s}
.row:hover .del,.row.sel .del{color:var(--t2)}
.del:hover{background:#de7f8622;color:var(--risky)!important}
.row{touch-action:none;user-select:none;transition:opacity .15s}
.row.drag{opacity:.35}
.row.in{animation:rowIn .22s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes rowIn{from{opacity:0;transform:translateX(var(--dx))}}
.fadeIn{animation:fadeIn .22s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}}
.del.lock{cursor:not-allowed;color:var(--t4)}
.del svg{width:14px;height:14px}
.empty{padding:40px;text-align:center;color:var(--t4)}

#detail{flex:none;max-height:52%;overflow:auto;padding:18px 18px 16px;border-top:1px solid var(--line)}
.dname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpath{font:11px var(--mono);color:var(--t4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dsize{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.dsize b{font-size:26px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.dsize span{color:var(--t3);font-size:12px}
.vline{display:flex;gap:8px;align-items:baseline;margin-top:12px;line-height:1.5}
.vline i{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.vline b{font-weight:500;white-space:nowrap}
.vline span{color:var(--t2)}
.comp{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px;margin-top:16px}
.comp i{display:block;height:100%}
details{margin-top:10px}
summary{cursor:pointer;color:var(--t3);font-size:12px;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
details[open]>summary:before{transform:rotate(90deg)}
summary:hover{color:var(--t2)}
.dl{display:grid;gap:1px;margin-top:8px;font-size:12px}
.dl div{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;color:var(--t2);min-width:0}
.dl div[data-t]{cursor:pointer}
.dl div[data-t]:hover{background:var(--hov)}
.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{font-weight:400;color:var(--t3);font-variant-numeric:tabular-nums}
.dl .h{color:var(--t4);font-size:11px;padding:8px 6px 2px}
.why{margin:8px 0 0;padding:0 0 0 15px;color:var(--t3);font-size:12px;display:grid;gap:2px}
.pv{margin-top:8px;border-radius:8px;overflow:hidden;background:#0d0d0f}
.pv pre{margin:0;padding:10px 12px;font:11px/1.6 var(--mono);color:var(--t3);white-space:pre;overflow:hidden;max-height:150px}
.pv .img{height:140px;position:relative}
.pv .img span,.pv .vid span{position:absolute;right:8px;bottom:7px;font-size:11px;color:#fff;background:#0009;padding:1px 6px;border-radius:4px}
.pv .vid{height:140px;position:relative;background:#1c1b22;display:flex;align-items:center;justify-content:center;color:#fff9;font-size:18px}
.pv .film{position:absolute;left:0;right:0;bottom:0;height:20px;display:flex;gap:1px}
.pv .film i{flex:1;opacity:.55}
.dact{display:flex;gap:4px;margin-top:16px;margin-left:-11px}

/* ---------- trash dock ---------- */
#dock{flex:none;margin-top:auto;transition:padding .3s,border-color .3s;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:12px;padding:12px 14px 10px 18px;min-width:0}
#dock .dk{flex:1;min-width:0;align-self:center}
#dock .dt{color:var(--t2);font-size:12px}
#dock .dsz{font-size:20px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.3}
#dock .ds{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .da{display:flex;gap:2px;margin:6px 0 0 -9px}
#bin{position:relative;width:54px;height:60px;flex:none;cursor:pointer;margin-top:0;transition:width .38s cubic-bezier(.3,1.2,.5,1),height .38s cubic-bezier(.3,1.2,.5,1),margin-top .38s ease}
#bin .bw{position:absolute;right:0;bottom:0;transform-origin:50% 100%}
#bin .bw>*{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#bin .back{z-index:1}
#pile{z-index:2}
#pile i{position:absolute;border-radius:50%;box-shadow:inset -1.5px -1.5px 0 #00000038,inset 1px 1px 0 #ffffff30}
#pile i.new{animation:settle .24s cubic-bezier(.3,1.6,.5,1)}
@keyframes settle{0%{transform:translateY(-6px) scale(1.1,.85)}60%{transform:translateY(1px) scale(.95,1.06)}}
#bin .front{z-index:62;pointer-events:none}
#bin .lidl{z-index:63;pointer-events:none}
#bin .body,#bin .rim{transition:stroke .2s}
#bin .lid{transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
#bin.open .lid{transform:rotate(-42deg)}
#bin.open .lid2{transform:rotate(42deg)}
#bin.hot .lid{transform:rotate(-58deg)}
#bin.hot .lid2{transform:rotate(58deg)}
#bin.hot .body{stroke:#ffffff55}
#bin.lidless.open .rim{stroke:#7a7a83}
#bin.lidless.hot .bw{transform:scale(1.06)}
#bin.bump .bw{animation:bump .26s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:translateY(1.5px) scale(1.03,.97)}}
#bin.dump .lid{animation:dumpLid .55s ease}
#bin.dump .lid2{animation:dumpLid2 .55s ease}
@keyframes dumpLid{20%,60%{transform:rotate(-70deg)}}
@keyframes dumpLid2{20%,60%{transform:rotate(70deg)}}
#dock{position:relative;z-index:3}
#right.huge #bin{margin-top:-34px}
#detail{transition:padding-bottom .38s ease}
#right.huge #detail{padding-bottom:40px}
.ball{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;will-change:transform;box-shadow:inset -2px -2px 0 #00000030,inset 1.5px 1.5px 0 #ffffff35}
.shard{position:fixed;left:0;top:0;z-index:59;pointer-events:none;overflow:visible}
.morph{position:fixed;z-index:59;pointer-events:none;border-radius:6px}
/* ---------- scenes ---------- */
main{transition:grid-template-columns .5s cubic-bezier(.2,.8,.2,1)}
main.wide{grid-template-columns:minmax(0,1fr) clamp(340px,46%,640px)}
#right{position:relative}
#right.off #dock{border-top-color:transparent}
#right.off .disk,#right.off .lhead,#right.off #list,#right.off #detail,#right.off #dock .dk{visibility:hidden}
#right[data-scene="eval"] #bin{opacity:0;pointer-events:none}
#bin{transform-origin:50% 50%;transition:width .38s cubic-bezier(.3,1.2,.5,1),height .38s cubic-bezier(.3,1.2,.5,1),margin-top .38s ease,transform .55s cubic-bezier(.2,.8,.2,1),opacity .2s}
#bin.hero{cursor:default;z-index:4}
#pile i{transition:transform .15s,box-shadow .15s}
#bin.hero #pile i{cursor:pointer}
#pile i.hl{transform:scale(1.35);box-shadow:0 0 0 1px #fff,inset -1.5px -1.5px 0 #00000038;z-index:2}
#chartwrap,.lbot,.ltop .tabs,.legend{transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
#left.recede #chartwrap{opacity:.28;transform:scale(.9);cursor:pointer}
#left.recede .lbot,#left.recede .ltop .tabs{opacity:0;pointer-events:none}
.scene{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;min-height:0}
.scene.on{display:flex}
.scene .x{position:absolute;right:12px;top:12px;color:var(--t3)}
.scene .x svg{width:16px;height:16px}
#scTrash{padding:22px 0 var(--hero,180px)}
.tsh{position:relative;padding:0 24px}
.tsh .k{color:var(--t3);font-size:12px}
.tsh .big{font-size:34px;font-weight:600;letter-spacing:-.8px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.tsh .sub{color:var(--t3);font-size:12px;margin-top:2px}
.tsh .x{top:-10px}
.tsb{display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden;margin:16px 24px 4px;flex:none}
.tsl{flex:1;overflow:auto;padding:6px 12px 10px;min-height:0;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.tg{margin-top:12px}
.tg-h{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:12px;color:var(--t2);font-weight:500}
.tg-h i{width:6px;height:6px;border-radius:50%}
.tg-h em{font-style:normal;color:var(--t4);font-weight:400}
.tg-h span{margin-left:auto;color:var(--t3);font-weight:400;font-variant-numeric:tabular-nums}
.tg-why{padding:0 12px 4px 26px;font-size:11.5px;color:var(--review);opacity:.85}
.tr{display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:7px}
.tr:hover,.tr.hl{background:var(--hov)}
.tr i{width:7px;height:7px;border-radius:50%;flex:none}
.tr .n{flex:1;min-width:0}
.tr .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .n small{display:block;color:var(--t4);font:10.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr b{font-weight:400;color:var(--t2);font-size:12px;font-variant-numeric:tabular-nums}
.tr button{border:0;background:none;border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--t3);font-size:12px;visibility:hidden}
.tr:hover button,.tr.hl button{visibility:visible}
.tr button:hover{color:var(--text);background:var(--hov)}
.tsa{position:absolute;left:18px;right:18px;bottom:26px;display:flex;align-items:flex-end;pointer-events:none}
.tsa .btn{pointer-events:auto}
.sheet.inline{width:auto;max-height:none;height:100%;background:none;border:0;border-radius:0;box-shadow:none;animation:none;position:relative}
.sheet.inline .sh{padding-right:56px}
.sheet.inline .x{top:14px}
/* ---------- status ---------- */
footer{display:flex;align-items:center;gap:16px;padding:0 12px 0 14px;font-size:11.5px;color:var(--t4);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;border-top:1px solid var(--line)}
footer b{color:var(--t3);font-weight:400}
footer .tabs button{font-size:11.5px;padding:1px 7px;color:var(--t4)}
footer .tabs button.on{color:var(--t2)}
footer a{color:var(--t3);cursor:pointer}
footer a:hover{color:var(--text)}
footer .ok{color:var(--safe)}

/* ---------- fly chip ---------- */
.fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;background:var(--bg3);box-shadow:0 8px 20px -6px #000b;white-space:nowrap;font-size:12px;will-change:transform,opacity}
.fly i{width:6px;height:6px;border-radius:50%}
.fly span{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.fly b{color:var(--t3);font-weight:400}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--bg3);border-radius:7px;padding:7px 10px;font-size:12px;box-shadow:0 10px 24px -8px #000c;display:none;max-width:300px}
#tip .tn{font-weight:500;word-break:break-all}
#tip .ts{color:var(--t3);margin-top:1px;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:#0009;z-index:70;display:none;align-items:center;justify-content:center}
.modal.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(760px,94vw);max-height:86vh;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 80px -20px #000;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
.sheet .sh{padding:22px 24px 0}
.sheet h2{margin:0;font-size:16px;font-weight:600}
.sheet .scope{color:var(--t3);font-size:12px;margin-top:3px}
.ebar{display:flex;flex:none;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin:18px 24px 0}
.ebar i{display:block;height:100%}
.elg{display:flex;flex:none;gap:22px;padding:10px 24px 6px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.elg div{display:flex;align-items:center;gap:7px}
.elg i{width:6px;height:6px;border-radius:50%}
.elg b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.evl{overflow:auto;flex:1;padding:4px 14px 8px}
.evg{margin:0 10px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:8px;padding:14px 0 6px;position:sticky;top:0;background:var(--bg2);z-index:1;font-weight:500}
.evg em{font-style:normal;color:var(--t4);font-weight:400}
.evg label{margin-left:auto;cursor:pointer;color:var(--t3);font-weight:400}
.evg label:hover{color:var(--text)}
.evr{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer}
.evr:hover{background:var(--hov)}
.evr input{accent-color:var(--text);width:14px;height:14px;margin:0}
.evr .n{min-width:0}
.evr .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evr .n small{display:block;color:var(--t4);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evr b{text-align:right;font-variant-numeric:tabular-nums;font-weight:400;color:var(--t2)}
.sheet .ft{display:flex;align-items:center;gap:6px;padding:14px 18px 14px 24px;border-top:1px solid var(--line)}
.sheet .ft .sum{color:var(--t3)}
.sheet .ft .sum b{color:var(--text);font-weight:500}
.confirm{width:min(420px,92vw)}
.confirm p{padding:8px 24px 18px;margin:0;color:var(--t2)}
.confirm .ft{border-top:0;padding-top:0}

/* ---------- toast ---------- */
#toasts{position:fixed;left:calc(50% - 196px);bottom:92px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:80}
.toast{background:var(--bg3);border-radius:8px;padding:7px 8px 7px 14px;display:flex;gap:6px;align-items:center;box-shadow:0 12px 30px -10px #000;animation:pop .18s ease-out;white-space:nowrap}
.toast span{margin-right:6px}
.toast button{border:0;background:none;border-radius:5px;padding:3px 8px;cursor:pointer;color:var(--text);font-size:12px;font-weight:500}
.toast button:hover{background:var(--hov)}
.toast.out{opacity:0;transform:translateY(4px);transition:.25s}
.freed{position:fixed;z-index:65;pointer-events:none;font-size:20px;font-weight:600;color:var(--safe);white-space:nowrap;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
body.static *{animation:none!important;transition:none!important}
/* auto-clean analysis */
.lbot{position:relative}
#anBar{position:absolute;left:20px;right:16px;top:-10px;height:2px;background:var(--safe);opacity:.55;border-radius:1px;transform:scaleX(0);transform-origin:0 50%}
#left.busy #bEval{visibility:hidden}
#left.busy #bFree{background:var(--bg3);color:var(--text);font-weight:500}
.lbot .cs .ph{color:var(--t2);margin-right:10px}
.lbot .cs .hz{color:var(--review)}
.spin{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--t4);border-top-color:var(--safe);margin-right:9px;vertical-align:-1px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* back / up affordances */
.up{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 9px 0 4px;border:0;border-radius:7px;background:var(--bg3);color:var(--t2);cursor:pointer;font-size:12.5px;white-space:nowrap;max-width:150px;flex:none;transition:background .12s,color .12s}
.up:hover{background:#2b2b30;color:var(--text)}
.up svg{width:16px;height:16px;flex:none}
.up span{overflow:hidden;text-overflow:ellipsis}
.up[hidden]{display:none}
.up.in{animation:upIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes upIn{from{opacity:0;transform:translateX(-6px)}}
.lhead .lup{width:24px;height:24px;margin:0 -2px 3px -6px;padding:0;border:0;border-radius:6px;background:none;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.lhead .lup:hover{background:var(--hov);color:var(--text)}
.lhead .lup svg{width:16px;height:16px}
.lhead .lup[hidden]{display:none}
/* habit learning */
.hb{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;font-size:10.5px;color:var(--review);background:#d4a6561a;vertical-align:1px}
.hline{margin:6px 0 0 15px;font-size:12px;color:var(--t3)}
.hline b{color:var(--review);font-weight:500}
.confirm .src{display:grid;gap:4px;margin-top:12px;font-size:12.5px}
.confirm .src div{display:flex;align-items:center;gap:8px;color:var(--t3)}
.confirm .src i{width:6px;height:6px;border-radius:50%}
.confirm .src b{color:var(--text);font-weight:500}
.confirm .src span{margin-left:auto;font-variant-numeric:tabular-nums}
.confirm .hx{margin-top:12px;padding:10px 12px;border-radius:8px;background:#d4a6560d;display:grid;gap:6px}
.confirm .hxr b{display:block;color:var(--review);font-weight:500;font-size:12.5px}
.confirm .hxr span{font-size:12px;color:var(--t3)}
.confirm .hx .btn{justify-self:start;margin-left:-9px}
.evr .n small .hz{color:var(--review)}
/* ---------- r7: message-pop confirm (grows out of the panel's top-left corner) ---------- */
.ask{position:absolute;left:14px;top:14px;z-index:30;width:min(372px,calc(100% - 28px));background:#252529;border-radius:4px 16px 16px 16px;
  box-shadow:0 1px 0 #ffffff0d inset,0 24px 60px -18px #000,0 6px 18px -8px #0008;padding:16px 16px 12px 16px;transform-origin:0 0;display:none}
.ask.on{display:block}
.ask .ah{display:flex;gap:12px;align-items:flex-start}
.ask .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#de7f861c;color:var(--risky)}
.ask .av.n{background:#ffffff0f;color:var(--t2)}
.ask .av svg{width:16px;height:16px}
.ask h3{margin:5px 0 0;font-size:14px;font-weight:600;letter-spacing:-.1px}
.ask .ab{margin:6px 0 0 42px;color:var(--t2);font-size:12.5px;line-height:1.6}
.ask .ab .src{display:grid;gap:5px;margin-top:12px}
.ask .ab .src div{display:flex;align-items:center;gap:8px;color:var(--t3)}
.ask .ab .src i{width:6px;height:6px;border-radius:50%;flex:none}
.ask .ab .src b{color:var(--text);font-weight:500}
.ask .ab .src span{margin-left:auto;font-variant-numeric:tabular-nums}
.ask .ab .sbar{display:flex;gap:2px;height:3px;border-radius:2px;overflow:hidden;margin-top:12px}
.ask .ab .hx{margin-top:12px;padding:10px 12px;border-radius:10px;background:#d4a65610;display:grid;gap:6px}
.ask .ab .hxr b{display:block;color:var(--review);font-weight:500}
.ask .ab .hxr span{font-size:12px;color:var(--t3)}
.ask .ab .hx .btn{justify-self:start;margin-left:-9px;color:var(--review)}
.ask .af{display:flex;justify-content:flex-end;gap:4px;margin-top:14px}
#right>*:not(.ask):not(#dock),#right #dock .dk{transition:opacity .25s,filter .25s}
#right.asking>*:not(.ask):not(#dock),#right.asking #dock .dk{opacity:.18;filter:blur(1.5px);pointer-events:none}
/* ---------- r7: trash view of the sunburst ---------- */
.tvt{position:absolute;left:24px;top:14px;display:flex;align-items:baseline;gap:10px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.tvt b{font-weight:600;font-size:13px}
.tvt span{color:var(--t3);font-size:12px}
#left.tv .tvt{opacity:1}
#left.tv .crumbs,#left.tv #bUp,#left.tv .ltop .tabs,#left.tv .lbot,#left.tv .legend{opacity:0;pointer-events:none}
.ltop{position:relative}
.crumbs,#bUp{transition:opacity .3s}
#tvLg{position:absolute;left:20px;bottom:36px;display:grid;gap:3px;font-size:12px;color:var(--t3);pointer-events:none;opacity:0;transition:opacity .3s}
#left.tv #tvLg{opacity:1}
#tvLg div{display:flex;align-items:center;gap:8px}
#tvLg i{width:6px;height:6px;border-radius:2px;flex:none}
#tvLg b{color:var(--t2);font-weight:400;margin-left:8px;font-variant-numeric:tabular-nums}
/* ---------- r7: polish ---------- */
.tsh .big small{font-size:18px;font-weight:500;color:var(--t2);margin-left:4px;letter-spacing:0}
.tsh .big{font-weight:650}
#scTrash::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--hero,180px);pointer-events:none;
  background:radial-gradient(60% 70% at 50% 100%,#ffffff0a,transparent 70%)}
#bin::after{content:"";position:absolute;left:8%;right:8%;bottom:-5px;height:9px;border-radius:50%;background:radial-gradient(closest-side,#000c,transparent);opacity:0;transition:opacity .4s;z-index:0;pointer-events:none}
#bin.hero::after{opacity:1}
.btn.soft-danger{color:var(--risky);background:#de7f8614;font-weight:500}
.btn.soft-danger:hover{background:#de7f8626;color:#f0a0a6}
.tsh .bs{position:absolute;right:52px;top:-6px}
.tg-h{letter-spacing:.1px}
.tr{padding:6px 12px}
.tr i{width:6px;height:6px}
.tsb{height:3px;margin-top:18px}
/* ---------- r7: bin drawing styles ---------- */
#bin.s-line svg *{fill:none!important;stroke:#c9c9d1!important;stroke-width:1.15px!important}
#bin.s-line .back *{stroke:#ffffff1c!important}
#bin.s-line .front path:not(.body):not(.rim),#bin.s-line .front rect:not([height="5"]):not([height="5.5"]){stroke:#ffffff30!important}
#bin.s-line #pile i{background:none!important;box-shadow:inset 0 0 0 1.25px currentColor}
#bin.s-line #pile i.hl{background:currentColor!important}
#bin.s-clay .back path:first-child{fill:var(--cl3)!important}
#bin.s-clay .back ellipse{fill:var(--cl3)!important;stroke:var(--cl1)!important}
#bin.s-clay .front .body{fill:url(#clB)!important;fill-opacity:.6;stroke:#ffffff26!important;stroke-width:.8px!important}
#bin.s-clay .front path:not(.body):not(.rim){stroke:#0000002a!important}
#bin.s-clay .front .rim{stroke:var(--cl1)!important}
#bin.s-clay .front rect,#bin.s-clay .lidl rect{fill:url(#clL)!important;stroke:none!important}
#bin.s-clay .lidl path{stroke:var(--cl1)!important}
#bin.s-clay .front rect[height="9"]{fill:#00000055!important;stroke:#ffffff14!important}
#bin.s-clay circle{fill:#232328!important;stroke:#ffffff14!important}
#bin.s-clay circle[r="3"]{fill:var(--cl1)!important}
#bin.s-clay #pile i{box-shadow:inset -2px -2.5px 3px #0006,inset 1.5px 1.5px 2px #ffffff70}
/* ---------- r8: HUD theme (holographic linework, overlay instruments) ---------- */
#hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#chartwrap::before,#chartwrap::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
body.hud #chartwrap::before{opacity:1;background:
  radial-gradient(closest-side at 50% 50%,#3fd2c412,transparent 78%),
  linear-gradient(#7fe7f20a 1px,transparent 1px) 50% 50%/32px 32px,
  linear-gradient(90deg,#7fe7f20a 1px,transparent 1px) 50% 50%/32px 32px;
  -webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 55%,transparent 100%)}
body.hud #chartwrap::after{opacity:.55;z-index:2;background:repeating-linear-gradient(0deg,transparent 0 2px,#0000002e 2px 3px)}
body.hud #tip{display:none!important}
body.hud .crumbs span.cur{color:#bff5ee}
/* ---------- r8: auto-clean, the left panel's one big action ---------- */
#bFree.big{height:46px;padding:0 8px 0 16px;border-radius:13px;font-size:14.5px;font-weight:600;gap:10px;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#f6f6f8,#dcdce1);color:#111114;box-shadow:0 1px 0 #ffffffb0 inset,0 12px 28px -12px #6fc39a99,0 2px 6px -2px #0008;transition:transform .15s,box-shadow .2s,background .3s,color .3s}
#bFree.big:hover{transform:translateY(-1px);box-shadow:0 1px 0 #fff inset,0 16px 34px -12px #6fc39acc,0 2px 6px -2px #0008}
#bFree.big:active{transform:translateY(1px) scale(.985)}
body.hud #bFree.big{background:linear-gradient(180deg,#9af3ea,#3fc4b8);color:#03211e;box-shadow:0 1px 0 #e6fffc inset,0 0 0 1px #7fe7f255,0 14px 34px -12px #3fd2c4cc,0 0 26px -8px #3fd2c4aa}
#bFree.big svg{width:18px;height:18px;flex:none}
#bFree .bsz{font:600 12px var(--mono);padding:4px 8px;border-radius:8px;background:#0000001c;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
#bFree .bsz:empty{display:none}
#bFree.big::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,#ffffffa0 50%,transparent 65%);transform:translateX(-120%)}
#bFree.big:hover::after{transition:transform .7s ease;transform:translateX(120%)}
#bFree .bfill{position:absolute;inset:0;z-index:-1;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#3fd2c430,#3fd2c4a0);transition:transform .12s linear}
#left.busy #bFree.big{background:#10201f;color:#c9faf4;box-shadow:0 0 0 1px #3fd2c455 inset,0 0 30px -10px #3fd2c4aa}
#left.busy #bFree.big::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,transparent 0 10px,#3fd2c40f 10px 20px);animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:22px 0}}
body.hud #bFree.big:disabled,#bFree.big:disabled{background:var(--bg3);color:var(--t3);box-shadow:none;transform:none}
#bFree.big:disabled::after{display:none}
.lbot{padding-bottom:18px}
/* ---------- r9: MECH theme — light armour plates, cobalt / signal red / caution yellow, chamfered cuts ---------- */
body.mech{--bg:#e4e7eb;--bg2:#f1f3f5;--bg3:#d6dae0;--hov:#16224012;--sel:#1f4fa81f;--line:#16224021;
  --text:#141a26;--t2:#444e62;--t3:#737c8f;--t4:#9ea6b4;--safe:#1d8a58;--review:#c08400;--risky:#d7262e;--prot:#6b7385;
  --mb:#1f4fa8;--mr:#d7262e;--my:#f2b705;--cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
body.mech #tip{display:none!important}
body.mech #right{background:var(--bg2);border-left:1px solid var(--line);box-shadow:-1px 0 0 #fff inset}
body.mech #right::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,var(--mb) 0 58%,transparent 58% 60%,var(--mr) 60% 74%,transparent 74% 76%,var(--my) 76% 86%,transparent 86%)}
body.mech #chartwrap::before{opacity:1;background:
  linear-gradient(#16224010 1px,transparent 1px) 50% 50%/120px 120px,
  linear-gradient(90deg,#16224010 1px,transparent 1px) 50% 50%/120px 120px,
  linear-gradient(#16224008 1px,transparent 1px) 50% 50%/24px 24px,
  linear-gradient(90deg,#16224008 1px,transparent 1px) 50% 50%/24px 24px;
  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%)}
body.mech .crumbs span.cur{color:var(--text);font-weight:600}
body.mech .tabs button.on{background:#fff;color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 0 #16224018}
body.mech footer{background:var(--bg3);border-top:1px solid var(--line)}
body.mech footer .tabs button.on{background:var(--text);color:#fff;box-shadow:none}
body.mech .btn.solid:hover,body.mech .up:hover{background:#c9ced6}
body.mech .btn.primary{background:var(--mb);color:#fff;clip-path:var(--cut);border-radius:0}
body.mech .btn.primary:hover{background:#2a5fc4;color:#fff}
body.mech .btn.danger,body.mech .btn.danger:hover{background:var(--mr);color:#fff;clip-path:var(--cut);border-radius:0}
body.mech .btn.primary:disabled{background:var(--bg3);color:var(--t3)}
body.mech .ask{background:#fff;border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  box-shadow:none;outline:1px solid var(--line);border-top:3px solid var(--mr)}
body.mech .ask .av.n{background:var(--bg3)}
body.mech .toast,body.mech .fly{background:#fff;box-shadow:0 0 0 1px var(--line),0 12px 28px -14px #16224066;border-radius:0;clip-path:var(--cut)}
body.mech .sheet{box-shadow:0 30px 70px -30px #16224066}
body.mech #bin.hot .body{stroke:#16224066}
body.mech #bin.s-line svg *{stroke:#3a4356!important}
body.mech #bin.s-line .back *{stroke:#16224030!important}
body.mech #bin.s-line .front path:not(.body):not(.rim),body.mech #bin.s-line .front rect:not([height="5"]):not([height="5.5"]){stroke:#16224055!important}
body.mech #bin.s-clay circle{fill:#3a4356!important}
body.mech ::-webkit-scrollbar-thumb{background:#16224024;background-clip:padding-box}
/* the big action: cobalt plate, caution-yellow edge, chamfered */
body.mech #bFree.big{border-radius:0;clip-path:var(--cut);color:#fff;
  background:linear-gradient(90deg,var(--my) 0 5px,#141a26 5px 7px,transparent 7px),linear-gradient(180deg,#2d63c8,#1b4499);
  box-shadow:0 1px 0 #ffffff40 inset}
body.mech #bFree.big:hover{box-shadow:0 1px 0 #ffffff60 inset;filter:brightness(1.06)}
body.mech #bFree .bsz{background:#ffffff26;border-radius:0}
body.mech #bFree .bfill{background:linear-gradient(90deg,#f2b70530,#f2b705a0)}
body.mech #left.busy #bFree.big{background:#141a26;color:#fff;box-shadow:none}
body.mech #left.busy #bFree.big::before{background:repeating-linear-gradient(115deg,transparent 0 10px,#f2b7051f 10px 20px)}
body.mech #bFree.big:disabled{background:var(--bg3);color:var(--t3);filter:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#ffffff14;border-radius:4px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#ffffff22}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="left">
      <div class="ltop">
        <button class="up" id="bUp" hidden title="返回上级（Esc）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg><span id="bUpTxt"></span></button><div class="crumbs" id="crumbs"></div>
        <div class="tvt" id="tvT"></div>
        <div class="tabs" id="cmode"><button data-m="cat" class="on">目录</button><button data-m="safety">安全性</button></div>
      </div>
      <div id="chartwrap">
        <canvas id="cv"></canvas>
        <canvas id="hud"></canvas>
        <div class="legend" id="legend"></div>
        <div id="tvLg"></div>
        <div id="scan"><div class="num" id="scanNum">0</div><div class="path" id="scanPath"></div><div style="display:none"><div id="scanBar"></div></div></div>
      </div>
      <div class="lbot"><div id="anBar"></div>
        <div class="cs" id="cleanSum"></div>
        <button class="btn" id="bEval">查看评估</button>
        <button class="btn primary big" id="bFree"><span class="bfill"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.6 4.2 4.2 1.6-4.2 1.6L12 15.1l-1.6-4.2-4.2-1.6 4.2-1.6z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/><path d="M5.5 15.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg><span id="bFreeTxt">自动清理</span><span class="bsz" id="bFreeSz"></span></button>
      </div>
    </section>
    <aside id="right">
      <div class="disk">
        <div class="dt"><span id="dVol"></span>
          <button class="btn icon sm" id="bRescan" title="重新扫描"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4.5V9h-4.5"/></svg></button></div>
        <div class="diskbar"><div class="u" id="dbU"></div><div class="t" id="dbT"></div></div>
        <div class="disktxt" id="dTxt"></div>
      </div>
      <div class="lhead">
        <button class="lup" id="lUp" hidden title="返回上级（Esc）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><div style="min-width:0;flex:1"><div class="t" id="lTitle"></div><div class="c" id="lCount"></div></div>
        <div class="tabs" id="lsort"><button data-s="size" class="on">大小</button><button data-s="name">名称</button><button data-s="age">时间</button></div>
      </div>
      <div id="list"><div id="spacer"></div></div>
      <div id="detail"></div>
      <div class="scene" id="scTrash"></div>
      <div class="scene" id="scEval"><div class="sheet inline" id="scEvalIn"></div></div>
      <div class="ask" id="ask" role="alertdialog"></div>
      <div id="dock">
        <div class="dk">
          <div class="dt" id="dkTitle">废纸篓</div>
          <div class="dsz" id="dkSize">0 B</div>
          <div class="ds" id="tSz"></div>
          <div class="da"><button class="btn sm" id="dkView">查看</button><button class="btn sm" id="dkEmpty" disabled>清空</button></div>
        </div>
        <div id="bin"></div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="tabs" id="theme"><button data-t="hud">HUD</button><button data-t="mech">机甲</button><button data-t="classic">经典</button></div>
    <div class="tabs" id="plat"><button data-p="mac">macOS</button><button data-p="win">Windows</button><button data-p="linux">Linux</button></div>
    <span><b id="sNodes">0</b> 个节点</span>
    <span>扫描 <b id="sScan">-</b></span>
    <span>布局 <b id="sLayout">-</b></span>
    <span>绘制 <b id="sDraw">-</b> · <b id="sArcs">-</b> 扇区</span>
    <span class="sp"></span>
    <a id="stress">压力测试 ×10</a>
    <span>已释放 <b class="ok" id="sFreed">0 B</b></span>
  </footer>
</div>

<div id="toasts"></div>
<script>
'use strict';
/* =========================================================================
   Utilities
   ========================================================================= */
const $ = s => document.querySelector(s);
const KB = 1024, MB = KB * 1024, GB = MB * 1024;
const TAU = Math.PI * 2, A0 = -Math.PI / 2;
const NOW = Date.now();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(b) {
  if (b < KB) return Math.round(b) + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1000 && i < 3);
  return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + ' ' + u[i];
}
const num = n => n.toLocaleString('en-US');
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  const row = (x, i) => `<label class="evr"><input type="checkbox" data-i="${i}" ${checked.has(x) ? 'checked' : ''}><div class="n"><div>${esc(x.n.name)}</div><small>${x.habit ? `<span class="hz">依据你的习惯</span> · 你曾手动删除 ${x.habit.d} 个 ${esc(x.habit.label)}${x.habit.seed ? '（示例历史）' : ''}` : `${esc(x.r.tag)} · ${esc(x.r.reason)}`}</small></div><b>${fmt(x.n.size)}</b></label>`;
  const tot = scope.size || 1, K = ['safe', 'review', 'risky', 'protected'];
  sheet.innerHTML = `<div class="sh" data-st><button class="btn icon x" id="evClose" title="关闭（Esc）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h2>安全评估</h2><div class="scope">${esc(displayPath(scope))} · ${num(scope.cnt)} 个项目 · ${RULES.size + 1} 条规则</div></div>
    <div class="ebar" data-st>${K.map(k => `<i style="width:${100 * s[k] / tot}%;background:${LV[k].c}"></i>`).join('')}</div>
    <div class="elg" data-st>${K.map(k => `<div><i style="background:${LV[k].c}"></i>${LV[k].l} <b>${fmt(s[k])}</b></div>`).join('')}</div>
    <div class="evl" id="evl" data-st>
      <div class="evg">可安全清理 <em>${safe.length} 项</em><label data-g="safe">全选</label></div>
      ${safe.map((x, i) => row(x, i)).join('') || '<div class="empty">没有发现可安全清理的项目</div>'}
      ${habit.length ? `<div class="evg">依据你的习惯 <em>${habit.length} 项 · 学自你的手动删除</em><label data-g="habit">全选</label></div>${habit.map((x, i) => row(x, i + safe.length)).join('')}` : ''}
      ${review.length ? `<details class="evd"><summary class="evg" style="display:flex">建议复核 <em>${review.length} 项 · 默认不选</em></summary>${review.map((x, i) => row(x, i + safe.length + habit.length)).join('')}</details>` : ''}
    </div>
    <div class="ft" data-st><div class="sum">已选 <b id="evN">0</b> 项，共 <b id="evS">0</b></div><span style="flex:1"></span>
      <button class="btn" id="evCancel">取消</button><button class="btn primary" id="evGo">移至${P.trash}</button></div>`;
  const upd = () => {
    let n = 0, sz = 0; for (const x of checked) { n++; sz += x.n.size; }
    $('#evN').textContent = n; $('#evS').textContent = fmt(sz);
    $('#evGo').disabled = !n; $('#evGo').textContent = n ? `释放 ${fmt(sz)}` : `移至${P.trash}`;
    evalHL = new Set([...checked].map(x => x.n)); dirty = true;     // the hero shows exactly what will go
  };
  upd();
  $('#evl').onchange = e => { const x = all[+e.target.dataset.i]; if (e.target.checked) checked.add(x); else checked.delete(x); upd(); };
  $('#evl').onclick = e => {
    const g = e.target.closest('label[data-g]'); if (!g) return; e.preventDefault();
    const grp = g.dataset.g === 'safe' ? safe : g.dataset.g === 'habit' ? habit : review; const allOn = grp.every(x => checked.has(x));
    grp.forEach(x => allOn ? checked.delete(x) : checked.add(x));
    sheet.querySelectorAll('input[data-i]').forEach(inp => inp.checked = checked.has(all[+inp.dataset.i])); upd();
  };
  $('#evCancel').onclick = $('#evClose').onclick = closeEval;
  $('#evl').onmouseover = e => { const r = e.target.closest('.evr'); setHover(r ? all[+r.querySelector('input').dataset.i].n : null); };
  $('#evl').onmouseleave = () => setHover(null);
  $('#evGo').onclick = () => {
    const sel = all.filter(x => checked.has(x));
    if (colorMode !== 'safety') setColorMode('safety');
    closeEval();
    setTimeout(() => { draw(performance.now()); freeUp(sel); }, 360);
  };
  goScene('eval');
}
function closeEval() { setHover(null); goScene('explore'); }

function safeCandidates() { const c = []; collect(root, c); return c.filter(x => x.r.level === 'safe'); }
function refreshFreeBtn() {
  if (anal) return 0;
  const t0 = performance.now();
  const all = safeCandidates(), c = all.filter(x => !inUse(x)), s = c.reduce((a, x) => a + x.n.size, 0), busy = all.length - c.length;
  $('#bFreeTxt').textContent = s ? '自动清理' : '已清理干净';
  $('#bFreeSz').textContent = s ? fmt(s) : '';
  $('#bFree').disabled = !s;
  $('#cleanSum').innerHTML = s ? `<i></i><b>${fmt(s)}</b> 可安全清理 · ${num(c.length)} 项` : `<i style="background:var(--t4)"></i>没有可安全清理的内容${busy ? `（${busy} 项正在使用，已跳过）` : ''}`;
  return performance.now() - t0;
}

/* =========================================================================
   Misc UI
   ========================================================================= */
/** Confirm as a message bubble that grows out of the panel's top-left corner; the panel behind it quiets down. */
const ICON_BIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7"/></svg>`;
const ICON_WARN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8.5v4.5M12 16.4v.1"/><path d="M10.3 4.2 2.9 17.3A2 2 0 0 0 4.6 20h14.8a2 2 0 0 0 1.7-2.7L13.7 4.2a2 2 0 0 0-3.4 0Z" stroke-linejoin="round"/></svg>`;
let askOpen = false;
function confirmBox(title, html, okLabel, onOk, danger, icon) {
  const el = $('#ask');
  el.innerHTML = `<div class="ah"><div class="av${danger ? '' : ' n'}">${icon || (danger ? ICON_WARN : ICON_BIN)}</div><h3>${esc(title)}</h3></div>
    <div class="ab">${html}</div><div class="af"><button class="btn" id="cfNo">取消</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cfOk">${esc(okLabel)}</button></div>`;
  el.getAnimations().forEach(a => a.cancel());
  el.classList.add('on'); $('#right').classList.add('asking'); askOpen = true;
  el.animate([{transform: 'translate(-6px,-6px) scale(.35)', opacity: 0, borderRadius: '4px 30px 30px 30px'},
    {transform: 'scale(1.015)', opacity: 1, offset: .7}, {transform: 'none', opacity: 1}], {duration: 340, easing: 'cubic-bezier(.2,.9,.3,1.1)'});
  [...el.querySelectorAll('.ah,.ab,.af')].forEach((c, i) => c.animate([{opacity: 0, transform: 'translateY(4px)'}, {opacity: 1, transform: 'none'}],
    {duration: 240, delay: 90 + i * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'}));
  $('#cfNo').onclick = askClose; $('#cfOk').onclick = () => { askClose(); onOk(); };
  setTimeout(() => $('#cfOk') && $('#cfOk').focus({preventScroll: true}), 60);
}
function askClose() {
  if (!askOpen) return; askOpen = false;
  const el = $('#ask'); $('#right').classList.remove('asking');
  el.animate([{transform: 'none', opacity: 1}, {transform: 'translate(-4px,-4px) scale(.6)', opacity: 0}], {duration: 170, easing: 'cubic-bezier(.4,0,1,1)'}).onfinish = () => { if (!askOpen) el.classList.remove('on'); };
}
document.addEventListener('pointerdown', e => { if (askOpen && !e.target.closest('#ask')) askClose(); }, true);
function toast(msg, actions = [], ms = 3800) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  for (const [l, fn] of actions) { const b = document.createElement('button'); b.textContent = l; b.onclick = () => { fn(); kill(); }; el.appendChild(b); }
  $('#toasts').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  setTimeout(kill, ms);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}
function segOn(sel, btn) { document.querySelectorAll(sel + ' button').forEach(b => b.classList.toggle('on', b === btn)); }
function setColorMode(m) { colorMode = m; segOn('#cmode', $(`#cmode [data-m="${m}"]`)); dirty = true; renderLegend(); renderRows(); }
$('#cmode').onclick = e => { const b = e.target.closest('button'); if (b) setColorMode(b.dataset.m); };
function renderDisk() {
  const used = root.size, tr = trashSize();
  $('#dbU').style.width = (100 * used / capacity) + '%';
  $('#dbT').style.width = (100 * tr / capacity) + '%';
  $('#dVol').textContent = root.name;
  $('#dTxt').innerHTML = `<b>${fmt(capacity - used - tr)}</b> 可用，共 ${fmt(capacity)}`;
}
function refreshNav() { renderCrumbs(); updateList(); renderDetail(); renderLegend(); dirty = true; }
function refreshAll() {
  refreshNav(); renderDisk(); renderTrashBadge(); renderTrashPop(); refreshFreeBtn();
  $('#sNodes').textContent = num(root.cnt);
}

/* =========================================================================
   Scan (simulated) & boot
   ========================================================================= */
function scan(key) {
  if (anal) anal.cancel = true;
  platKey = key; P = PLAT[key]; loadHist();
  segOn('#plat', $(`#plat [data-p="${key}"]`));
  goScene('explore', true);
  trash.items = []; freedTotal = 0; $('#sFreed').textContent = '0 B';
  compCache.clear();
  const t0 = performance.now();
  R = mulberry32(P.seed); UID = 0;
  const r = P.build(scale);
  finalize(r, null, 0, P.prefix);
  const tBuild = performance.now() - t0;
  const t1 = performance.now(); layout(r, 0, 1); const tLay = performance.now() - t1;
  // pick a plausible capacity
  capacity = [256, 512, 1024, 2048, 4096, 8192].map(x => x * GB).find(c => r.size < c * .9) || r.size * 1.2;
  // scan overlay animation (the real Go scanner streams progress via events)
  const sc = $('#scan'); sc.classList.add('on');
  const paths = []; (function g(n, d) { if (paths.length > 400) return; if (d > 2 && R() < .02) paths.push(n); if (n.children) for (const c of n.children.slice(0, 20)) g(c, d + 1); })(r, 0);
  const STATIC = location.hash.includes('static'); if (STATIC) document.body.classList.add('static');
  const total = r.cnt, dur = STATIC ? 0 : 700, ts = performance.now();
  root = null; tip.style.display = 'none';
  const step = () => {
    const t = dur ? Math.min(1, (performance.now() - ts) / dur) : 1, e = easeOut(t);
    $('#scanNum').textContent = num(Math.round(total * e)) + ' 文件';
    $('#scanBar').style.width = (e * 100) + '%';
    const p = paths[(t * (paths.length - 1)) | 0]; if (p) $('#scanPath').textContent = displayPathFor(p, r);
    if (t < 1) return requestAnimationFrame(step);
    sc.classList.remove('on');
    root = r; focus = r; selected = null; hover = null;
    view = {x0: 0, x1: 1, d: 0}; zoom = morph = null; MT = 1;
    intro = STATIC ? null : {t0: performance.now(), dur: 780, k: 0};
    $('#sScan').textContent = tBuild.toFixed(0) + ' ms';
    $('#sLayout').textContent = tLay.toFixed(1) + ' ms';
    refreshAll();
    if (STATIC) staticHook();
  };
  requestAnimationFrame(step);
}
function displayPathFor(n, r) { const parts = []; for (let a = n; a.parent; a = a.parent) parts.push(a.name); return P.rootPath + parts.reverse().join(P.sep); }

$('#plat').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.p !== platKey) scan(b.dataset.p); };
$('#bRescan').onclick = () => scan(platKey);
$('#bEval').onclick = () => root && evaluate();
$('#bFree').onclick = () => autoClean();
$('#theme').onclick = e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.t); };
setTheme(new URLSearchParams(location.hash.slice(1)).get('theme') || THEME);
$('#bUp').onclick = $('#lUp').onclick = () => focus && focus.parent && zoomTo(focus.parent);
$('#stress').onclick = () => { scale = scale === 1 ? 10 : 1; $('#stress').textContent = scale === 1 ? '压力测试 ×10' : '恢复正常规模'; scan(platKey); };

document.addEventListener('keydown', e => {
  if (askOpen) { if (e.key === 'Escape') askClose(); return; }
  if (scene !== 'explore') { if (e.key === 'Escape') { setHover(null); closeScene(); } return; }
  if (!root) return;
  if (e.key === 'Escape' || (e.key === 'Backspace' && !e.metaKey)) { if (focus.parent) zoomTo(focus.parent); e.preventDefault(); }
  if (e.key === 'Delete' || (e.key === 'Backspace' && e.metaKey)) {
    if (selected && selected !== focus && attached(selected)) requestTrash(selected, rowsEl.querySelector(`[data-id="${selected.id}"]`));
  }
  if (e.key === 'Enter' && selected && selected.children) zoomTo(selected);
});

const guess = /Win/i.test(navigator.platform) ? 'win' : /Linux/i.test(navigator.platform) ? 'linux' : 'mac';
resize();
scan(new URLSearchParams(location.hash.slice(1)).get('plat') || guess);
function staticHook() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('drill')) for (const name of q.get('drill').split('/')) { const c = focus.children.find(x => x.name === name); if (c) { focus = c; selected = c; } }
  zoom = null; refreshNav();
  if (q.get('mode')) setColorMode(q.get('mode'));
  if (q.get('sel')) { const c = focus.children.find(x => x.name === q.get('sel')); if (c) select(c); }
  dirty = true;
  if (q.has('eval')) openEval();
  if (q.has('free')) { const c = safeCandidates(); removeNodes(c.map(x => x.n)).forEach(it => it.fly = false); renderTrashBadge(); }
  if (q.get('bin')) setBinStyle(q.get('bin'));
  if (q.get('scene') === 'trash') goScene('trash', true);
  if (q.has('ask')) emptyTrash(false);
}
</script>
